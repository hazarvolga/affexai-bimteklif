name: Verify

on:
  pull_request:
  push:
    branches: [main, master, feat/smartcheck-evaluation-baseline]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teklifpro_bootstrap_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teklifpro_bootstrap_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres-mfa:
        image: postgres:16
        env:
          POSTGRES_DB: teklifpro_bootstrap_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teklifpro_bootstrap_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres-session:
        image: postgres:16
        env:
          POSTGRES_DB: teklifpro_upgrade_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teklifpro_upgrade_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/teklifpro_bootstrap_test
      RELEASE_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/teklifpro_bootstrap_test
      NODE_ENV: test
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      GAP_ADMIN_SMOKE: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.1
          # pnpm is installed by the following step; automatic cache lookup needs it already on PATH.
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false
      - name: Select container validation
        id: container_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/teklifpro-changed-files"
            if grep -Eq '^(Dockerfile|\.dockerignore|compose\.(example|coolify)\.yaml|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|server\.ts|tsconfig\.json|vite\.config\.|src/|components/|public/|index\.html|workers/ifc/|scripts/release-migrations/|scripts/pdfa-matrix/|deploy/verapdf/|fixtures/phase-5/pdfa-matrix/|drizzle-release/|\.github/workflows/verify\.yml)' "$RUNNER_TEMP/teklifpro-changed-files"; then
              echo 'needed=true' >> "$GITHUB_OUTPUT"
            else
              echo 'needed=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: workers/ifc/requirements.txt
      - name: Install pinned IFC engine and run Python behavior tests
        run: |
          python -m pip install -r workers/ifc/requirements.txt
          python -m pytest workers/ifc -q
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: test -x "$PUPPETEER_EXECUTABLE_PATH"
      - name: PostgreSQL 16 CDE tenant RLS contract
        env:
          DATABASE_ROLE_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5432/postgres
          DATABASE_ROLE_TEST_CLUSTER_NAME: '<empty>'
          CI_DISPOSABLE_DATABASE: 'true'
        run: pnpm run test:tenant-rls:pg
      - name: PostgreSQL 16 progress-payment tenant RLS contract
        env:
          DATABASE_ROLE_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5432/postgres
          DATABASE_ROLE_TEST_CLUSTER_NAME: '<empty>'
          CI_DISPOSABLE_DATABASE: 'true'
        run: pnpm run test:progress-payment-tenant-rls:pg
      - name: PostgreSQL 16 SmartCheck pilot evidence tenant RLS contract
        env:
          DATABASE_ROLE_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5432/postgres
          DATABASE_ROLE_TEST_CLUSTER_NAME: '<empty>'
          CI_DISPOSABLE_DATABASE: 'true'
        run: pnpm run test:smartcheck-pilot-tenant-rls:pg
      - name: PostgreSQL 16 company industry settings tenant RLS contract
        env:
          DATABASE_ROLE_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5432/postgres
          DATABASE_ROLE_TEST_CLUSTER_NAME: '<empty>'
          CI_DISPOSABLE_DATABASE: 'true'
        run: pnpm run test:company-industry-tenant-rls:pg
      - name: PostgreSQL 16 CRM lead tenant RLS contract
        env:
          DATABASE_ROLE_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5432/postgres
          DATABASE_ROLE_TEST_CLUSTER_NAME: '<empty>'
          CI_DISPOSABLE_DATABASE: 'true'
        run: pnpm run test:crm-lead-tenant-rls:pg
      - name: PostgreSQL 16 tenant business tables RLS contract
        env:
          DATABASE_ROLE_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5432/postgres
          DATABASE_ROLE_TEST_CLUSTER_NAME: '<empty>'
          CI_DISPOSABLE_DATABASE: 'true'
        run: pnpm run test:tenant-business-rls:pg
      - name: Bootstrap disposable release roles
        run: |
          CI_DISPOSABLE_DATABASE=true pnpm exec tsx scripts/ci/disposable-database-roles.ts bootstrap
          {
            echo 'DATABASE_URL=postgresql://bimmetraj_app@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'CONTROL_DATABASE_URL=postgresql://bimmetraj_control@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'WORKER_DATABASE_URL=postgresql://bimmetraj_worker@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_SOURCE_DATABASE_URL=postgresql://postgres@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_SOURCE_CONTROL_DATABASE_URL=postgresql://postgres@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_SOURCE_WORKER_DATABASE_URL=postgresql://postgres@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_RUNTIME_DATABASE_URL=postgresql://bimmetraj_app@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_RUNTIME_CONTROL_DATABASE_URL=postgresql://bimmetraj_control@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_RUNTIME_WORKER_DATABASE_URL=postgresql://bimmetraj_worker@127.0.0.1:5432/teklifpro_bootstrap_test'
          } >> "$GITHUB_ENV"
      - run: pnpm exec tsx scripts/release-migrations/cli.ts apply
        env:
          RELEASE_WORKERS_DRAINED: 'true'
      - name: Session revocation bootstrap ACL contract
        env:
          CI_DISPOSABLE_DATABASE: 'true'
        run: pnpm exec tsx --test scripts/ci/session-bootstrap-contract.test.ts
      - name: Session revocation isolated PostgreSQL HTTP and cleanup
        env:
          NODE_ENV: test
          CI_DISPOSABLE_DATABASE: 'true'
          RELEASE_DATABASE_URL: postgresql://postgres@127.0.0.1:5434/teklifpro_upgrade_test
          SESSION_REVOCATION_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5434/teklifpro_upgrade_test
          RELEASE_WORKERS_DRAINED: 'true'
        run: |
          pnpm exec tsx scripts/ci/disposable-database-roles.ts bootstrap
          pnpm exec tsx scripts/ci/session-revocation-upgrade.ts
          pnpm exec tsx --test src/server/auth/session-revocation.pgtest.ts
      - name: Super administrator MFA provisioned role and HTTP contract
        env:
          NODE_ENV: test
          CI_DISPOSABLE_DATABASE: 'true'
          MFA_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5433/teklifpro_bootstrap_test
          RELEASE_WORKERS_DRAINED: 'true'
        run: |
          CI_DISPOSABLE_DATABASE=true RELEASE_DATABASE_URL=postgresql://postgres@127.0.0.1:5433/teklifpro_bootstrap_test pnpm exec tsx scripts/ci/disposable-database-roles.ts bootstrap
          RELEASE_DATABASE_URL=postgresql://postgres@127.0.0.1:5433/teklifpro_bootstrap_test pnpm exec tsx scripts/release-migrations/cli.ts apply
          pnpm exec tsx --test src/server/auth/mfa-http.pgtest.ts
      - name: Quotation and client tenant isolation over HTTP
        env:
          NODE_ENV: test
          CI_DISPOSABLE_DATABASE: 'true'
          IDOR_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5433/teklifpro_bootstrap_test
        run: pnpm exec tsx --test src/contracts/quotation-client-idor.pgtest.ts
      - name: Price review atomicity with provisioned runtime roles
        env:
          NODE_ENV: test
          CI_DISPOSABLE_DATABASE: 'true'
          PRICE_REVIEW_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5433/teklifpro_bootstrap_test
        run: pnpm exec tsx --test src/server/routes/admin-price-review.pgtest.ts
      - name: Quotation status and calibration audit atomicity
        env:
          NODE_ENV: test
          CI_DISPOSABLE_DATABASE: 'true'
          QUOTE_AUDIT_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5433/teklifpro_bootstrap_test
        run: pnpm exec tsx --test src/server/routes/quotation-audit-atomic.pgtest.ts
      - run: pnpm exec tsc --noEmit -p scripts/release-migrations/tsconfig.json
      - run: pnpm exec tsx --test scripts/release-migrations/artifacts.test.ts scripts/release-migrations/safety.test.ts scripts/release-migrations/runner-role.test.ts scripts/release-migrations/worker-drain-gate.test.ts scripts/release-migrations/backup-docker.test.ts scripts/database-roles/runtime-compose-contract.test.ts
      - run: python3 -m unittest deploy.backup.test_backup
      - name: Check disposable role contract before integration tests
        run: CI_DISPOSABLE_DATABASE=true pnpm exec tsx scripts/ci/disposable-database-roles.ts check
      - run: pnpm exec tsx --test scripts/ci/disposable-database-roles.test.ts
      - name: Verify isolated runtime connections and queue boundary
        run: pnpm exec tsx --test src/server/routes/test-isolation.test.ts
      # `pnpm run verify` split so the full suite runs once, under c8 (T43 coverage gate).
      - run: pnpm run lint
      - run: pnpm exec tsx --test scripts/ci/coverage-gate.test.ts
      - name: Full test suite with coverage report and ratchet gate
        env:
          REQUIRE_TEST_DATABASE: 'true'
          CI_DISPOSABLE_DATABASE: 'true'
          MFA_TEST_URL: postgresql://postgres:ci-local-only@127.0.0.1:5433/teklifpro_bootstrap_test
        run: pnpm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            coverage/
            !coverage/.v8/
          retention-days: 14
          if-no-files-found: ignore
      - run: pnpm run build
      - run: pnpm run prisma:validate:shadow
      - run: pnpm run prisma:shadow-contract
      - run: pnpm exec tsx scripts/gap-invitation-ui-smoke.ts
      - run: pnpm exec tsx scripts/e2e-core-flow-smoke.ts
      - run: pnpm exec tsx scripts/gap-crm-billing-ui-smoke.ts
      - run: pnpm exec tsx scripts/e2e-a11y-smoke.ts
      - run: pnpm exec tsx scripts/logout-ui-smoke.ts
      - run: pnpm exec tsx scripts/mfa-ui-smoke.ts
      - run: pnpm exec tsx scripts/client-deletion-impact-ui-smoke.ts
      - run: pnpm exec tsx scripts/shell-plan-ui-smoke.ts
      - run: pnpm exec tsx scripts/protected-route-title-ui-smoke.ts
      - run: pnpm exec tsx scripts/crm-partial-loading-ui-smoke.ts
      - run: pnpm exec tsx scripts/billing-period-ui-smoke.ts
      - run: node scripts/dependency-audit-policy.mjs
      # T45 bundle budget: the job runs with NODE_ENV=test, which ships React's development build, so
      # rebuild in production mode and run the bundle checks that otherwise skip when dist/ is absent.
      - name: T45 production bundle budget
        run: |
          NODE_ENV=production pnpm exec vite build
          REQUIRE_PRODUCTION_BUNDLE=true pnpm exec tsx --test --test-name-pattern "T45-2" src/contracts/t45-performance-budget.test.ts
      # The image build ran out of runner disk twice (Errno 28 during pip install). Remove preinstalled
      # toolchains this project never uses before building; print the free space for the next diagnosis.
      - name: Free runner disk for image builds
        if: steps.container_changes.outputs.needed == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune --force
          df -h /
      # Both targets share the same local Docker build cache: compile the source once.
      - name: Build app and IFC worker images
        if: steps.container_changes.outputs.needed == 'true'
        run: |
          docker build --target app --tag teklifpro-app:ci .
          docker build --target ifc-worker --tag teklifpro-ifc-worker:ci .
      - name: Network-isolated runtime artifact smoke
        if: steps.container_changes.outputs.needed == 'true'
        run: |
          docker run --rm --network none --read-only --entrypoint node teklifpro-app:ci -e '
            const fs = require("node:fs");
            if (process.getuid() !== 1000) throw new Error("Expected non-root runtime");
            for (const file of ["dist/server.cjs", "dist/worker.mjs", "dist/ifc-worker.mjs", "dist/release-cli.mjs", "dist/spreadsheet-worker.cjs", "/usr/bin/chromium"]) {
              if (!fs.existsSync(file)) throw new Error("Missing runtime artifact: " + file);
            }
            if (fs.existsSync(".env.local")) throw new Error("Private env file leaked into image");
          '
          docker run --rm --network none --read-only --entrypoint /opt/venv/bin/python3 teklifpro-ifc-worker:ci -c '
          import os, ifcopenshell
          assert os.getuid() == 1000
          assert ifcopenshell.version.startswith("0.8.4")
          assert os.path.isfile("dist/ifc-worker.mjs")
          assert os.path.isfile("workers/ifc/ifc_extract.py")
          '
          docker run --rm --network none --read-only --entrypoint /opt/venv/bin/python3 teklifpro-ifc-worker:ci workers/ifc/ifc_extract.py --help
      - name: T32 veraPDF fixture matrix in the IFC/PDF worker image
        if: steps.container_changes.outputs.needed == 'true'
        run: |
          docker run --rm --network none --read-only --memory 2048m --cpus 1.5 --pids-limit 128 \
            --tmpfs /tmp:size=536870912,mode=1777 --tmpfs /home/node/.cache:uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$PWD/fixtures:/fixtures:ro" --entrypoint node teklifpro-ifc-worker:ci dist/pdfa-matrix.mjs /fixtures

  e2e:
    # T43: real-browser Playwright E2E over the app, Vite SPA, IFC worker and an isolated PostgreSQL 16 schema.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teklifpro_bootstrap_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teklifpro_bootstrap_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/teklifpro_bootstrap_test
      RELEASE_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/teklifpro_bootstrap_test
      NODE_ENV: test
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: workers/ifc/requirements.txt
      - name: Install pinned IFC engine for the in-process IFC worker
        run: python -m pip install -r workers/ifc/requirements.txt
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: test -x "$PUPPETEER_EXECUTABLE_PATH"
      - name: Bootstrap disposable release roles
        run: |
          CI_DISPOSABLE_DATABASE=true pnpm exec tsx scripts/ci/disposable-database-roles.ts bootstrap
          {
            echo 'DATABASE_URL=postgresql://bimmetraj_app@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'CONTROL_DATABASE_URL=postgresql://bimmetraj_control@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'WORKER_DATABASE_URL=postgresql://bimmetraj_worker@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_SOURCE_DATABASE_URL=postgresql://postgres@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_SOURCE_CONTROL_DATABASE_URL=postgresql://postgres@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_SOURCE_WORKER_DATABASE_URL=postgresql://postgres@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_RUNTIME_DATABASE_URL=postgresql://bimmetraj_app@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_RUNTIME_CONTROL_DATABASE_URL=postgresql://bimmetraj_control@127.0.0.1:5432/teklifpro_bootstrap_test'
            echo 'TEST_ISOLATION_RUNTIME_WORKER_DATABASE_URL=postgresql://bimmetraj_worker@127.0.0.1:5432/teklifpro_bootstrap_test'
          } >> "$GITHUB_ENV"
      - run: pnpm exec tsx scripts/release-migrations/cli.ts apply
        env:
          RELEASE_WORKERS_DRAINED: 'true'
      - name: Check disposable role contract before E2E
        run: CI_DISPOSABLE_DATABASE=true pnpm exec tsx scripts/ci/disposable-database-roles.ts check
      - name: Playwright E2E (login, quotation, SmartCheck IFC, admin roadmap)
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
