name: teklifpro

x-runtime: &runtime
  restart: unless-stopped
  stop_grace_period: 90s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp:size=268435456,mode=1777
    - /home/node/.cache:size=67108864,uid=1000,gid=1000
    - /home/node/.config:size=16777216,uid=1000,gid=1000
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *runtime
    image: teklifpro-app:${IMAGE_TAG:-local}
    build:
      context: .
      target: app
    env_file: [./.env.app]
    environment:
      NODE_ENV: production
      PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=768
    ports: ['127.0.0.1:${APP_PORT:-3002}:3000']
    expose: ['3000']
    shm_size: 256mb
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256

  worker:
    <<: *runtime
    image: teklifpro-worker:${IMAGE_TAG:-local}
    build:
      context: .
      target: worker
    env_file: [./.env.worker]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      SMARTCHECK_WORKER_CONCURRENCY: ${SMARTCHECK_WORKER_CONCURRENCY:-2}
      GRAPHILE_WORKER_SCHEMA: ${GRAPHILE_WORKER_SCHEMA:-teklifpro_queue}
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 128

  ifc-worker:
    <<: *runtime
    image: teklifpro-ifc-worker:${IMAGE_TAG:-local}
    build:
      context: .
      target: ifc-worker
    env_file: [./.env.worker]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024
      SMARTCHECK_IFC_WORKER_CONCURRENCY: ${SMARTCHECK_IFC_WORKER_CONCURRENCY:-1}
      GRAPHILE_WORKER_SCHEMA: ${GRAPHILE_WORKER_SCHEMA:-teklifpro_queue}
      SMARTCHECK_IFC_ENGINE: ${SMARTCHECK_IFC_ENGINE:-legacy}
      SMARTCHECK_IFC_TIMEOUT_SEC: ${SMARTCHECK_IFC_TIMEOUT_SEC:-600}
      PYTHON_BIN: /opt/venv/bin/python3
    tmpfs:
      - /tmp:size=536870912,mode=1777
      - /home/node/.cache:size=67108864,uid=1000,gid=1000
    mem_limit: 2048m
    cpus: 1.5
    pids_limit: 128

  migrate:
    image: teklifpro-app:${IMAGE_TAG:-local}
    build:
      context: .
      target: migrate
    env_file: [./.env.app]
    environment:
      NODE_ENV: production
      RELEASE_DATABASE_URL: ${DATABASE_URL}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file: [./.env.postgres]
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, work_mem=4MB]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    shm_size: 128mb

volumes:
  postgres-data:
