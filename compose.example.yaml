name: teklifpro

x-runtime: &runtime
  restart: unless-stopped
  stop_grace_period: 90s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp:size=268435456,mode=1777
    - /home/node/.cache:size=67108864,uid=1000,gid=1000
    - /home/node/.config:size=16777216,uid=1000,gid=1000
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  app:
    <<: *runtime
    security_opt:
      - no-new-privileges:true
      - seccomp=${CHROMIUM_SECCOMP_PROFILE:-./deploy/chromium-seccomp.json}
    image: teklifpro-app:${IMAGE_TAG:-local}
    build:
      context: .
      target: app
    env_file: [./.env.app]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bimmetraj_app:${BIMMETRAJ_APP_DB_PASSWORD:?BIMMETRAJ_APP_DB_PASSWORD is required}@postgres:5432/bimmetraj_production
      CONTROL_DATABASE_URL: postgresql://bimmetraj_control:${BIMMETRAJ_CONTROL_DB_PASSWORD:?BIMMETRAJ_CONTROL_DB_PASSWORD is required}@postgres:5432/bimmetraj_production
      PG_POOL_MAX: '4'
      PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=768
    ports: ['127.0.0.1:${APP_PORT:-3002}:3000']
    expose: ['3000']
    shm_size: 256mb
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256

  worker:
    <<: *runtime
    image: teklifpro-worker:${IMAGE_TAG:-local}
    build:
      context: .
      target: worker
    env_file: [./.env.worker]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bimmetraj_worker:${BIMMETRAJ_WORKER_DB_PASSWORD:?BIMMETRAJ_WORKER_DB_PASSWORD is required}@postgres:5432/bimmetraj_production
      PG_POOL_MAX: '4'
      NODE_OPTIONS: --max-old-space-size=768
      SMARTCHECK_WORKER_CONCURRENCY: ${SMARTCHECK_WORKER_CONCURRENCY:-2}
      GRAPHILE_WORKER_SCHEMA: ${GRAPHILE_WORKER_SCHEMA:-teklifpro_queue}
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 128

  ifc-worker:
    <<: *runtime
    image: teklifpro-ifc-worker:${IMAGE_TAG:-local}
    build:
      context: .
      target: ifc-worker
    env_file: [./.env.worker]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bimmetraj_worker:${BIMMETRAJ_WORKER_DB_PASSWORD:?BIMMETRAJ_WORKER_DB_PASSWORD is required}@postgres:5432/bimmetraj_production
      PG_POOL_MAX: '4'
      NODE_OPTIONS: --max-old-space-size=1024
      SMARTCHECK_IFC_WORKER_CONCURRENCY: ${SMARTCHECK_IFC_WORKER_CONCURRENCY:-1}
      GRAPHILE_WORKER_SCHEMA: ${GRAPHILE_WORKER_SCHEMA:-teklifpro_queue}
      SMARTCHECK_IFC_ENGINE: ${SMARTCHECK_IFC_ENGINE:-ifcopenshell}
      SMARTCHECK_IFC_TIMEOUT_SEC: ${SMARTCHECK_IFC_TIMEOUT_SEC:-600}
      PYTHON_BIN: /opt/venv/bin/python3
    tmpfs:
      - /tmp:size=536870912,mode=1777
      - /home/node/.cache:size=67108864,uid=1000,gid=1000
    mem_limit: 2048m
    cpus: 1.5
    pids_limit: 128

  migrate:
    image: teklifpro-migrate:${IMAGE_TAG:-local}
    build:
      context: .
      target: migrate
    env_file: [./.env.migrator]
    environment:
      NODE_ENV: production
      PG_POOL_MAX: '4'
      RELEASE_DATABASE_URL: postgresql://bimmetraj_migrator:${BIMMETRAJ_MIGRATOR_DB_PASSWORD:?BIMMETRAJ_MIGRATOR_DB_PASSWORD is required}@postgres:5432/bimmetraj_production
      RELEASE_WORKERS_DRAINED: ${RELEASE_WORKERS_DRAINED:?RELEASE_WORKERS_DRAINED=true is required after workers are stopped}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: teklifpro-backup:${IMAGE_TAG:-local}
    build:
      context: ./deploy/backup
    env_file: [./.env.backup]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: bimmetraj_production
      PGUSER: bimmetraj_backup
      PGPASSWORD: ${BIMMETRAJ_BACKUP_DB_PASSWORD:?BIMMETRAJ_BACKUP_DB_PASSWORD is required}
    volumes:
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file: [./.env.postgres]
    environment:
      POSTGRES_DB: bimmetraj_production
      POSTGRES_USER: bimmetraj
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?SERVICE_PASSWORD_64_POSTGRES is required}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, work_mem=4MB]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    shm_size: 128mb

volumes:
  backup-data:
  postgres-data:
