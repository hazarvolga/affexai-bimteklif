<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background-color: #121316; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header Bar / Allplan Frame -->
  <rect x="0" y="0" width="1200" height="40" fill="#1e1f24" />
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />
  <text x="100" y="25" fill="#e2e8f0" font-size="13" font-weight="600">ALLPLAN 2026 Ultimate — [Project: Residential_Tower_BlockA.ndw] — Dark Mode Active</text>
  <rect x="1050" y="8" width="130" height="24" rx="4" fill="#3b82f6" />
  <text x="1065" y="24" fill="#ffffff" font-size="11" font-weight="bold">AI Assistant Active</text>

  <!-- Actionbar (Top Menu / Roles & Tasks) -->
  <rect x="0" y="40" width="1200" height="65" fill="#18191e" stroke="#2a2c34" stroke-width="1" />
  
  <!-- Role Selector -->
  <rect x="15" y="50" width="140" height="45" rx="6" fill="#2563eb" />
  <text x="30" y="70" fill="#ffffff" font-size="12" font-weight="bold">ROLE</text>
  <text x="30" y="86" fill="#ffffff" font-size="14" font-weight="extrabold">Architecture</text>
  
  <!-- Tasks Tabs -->
  <rect x="170" y="55" width="110" height="35" rx="4" fill="#2a2c34" />
  <text x="185" y="77" fill="#f8fafc" font-size="12" font-weight="bold">Elements</text>
  
  <rect x="290" y="55" width="110" height="35" rx="4" fill="transparent" />
  <text x="305" y="77" fill="#94a3b8" font-size="12" font-weight="medium">Modeling</text>

  <rect x="410" y="55" width="110" height="35" rx="4" fill="transparent" />
  <text x="425" y="77" fill="#94a3b8" font-size="12" font-weight="medium">Rooms &amp; Surfaces</text>

  <rect x="530" y="55" width="130" height="35" rx="4" fill="transparent" />
  <text x="545" y="77" fill="#94a3b8" font-size="12" font-weight="medium">Reports &amp; Takeoff</text>

  <!-- Blue Tools (Create) -->
  <rect x="680" y="48" width="240" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
  <text x="690" y="64" fill="#60a5fa" font-size="10" font-weight="bold">CREATE (Blue Icons)</text>
  <!-- Wall Icon -->
  <rect x="690" y="70" width="55" height="22" rx="3" fill="#2563eb" />
  <text x="698" y="85" fill="#ffffff" font-size="10" font-weight="bold">Wall (WA)</text>
  <!-- Column Icon -->
  <rect x="750" y="70" width="55" height="22" rx="3" fill="#2563eb" />
  <text x="755" y="85" fill="#ffffff" font-size="10" font-weight="bold">Column (CO)</text>
  <!-- Slab Icon -->
  <rect x="810" y="70" width="55" height="22" rx="3" fill="#2563eb" />
  <text x="822" y="85" fill="#ffffff" font-size="10" font-weight="bold">Slab</text>

  <!-- Gray Tools (Modify) -->
  <rect x="930" y="48" width="255" height="50" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
  <text x="940" y="64" fill="#94a3b8" font-size="10" font-weight="bold">MODIFY (Gray Icons)</text>
  <rect x="940" y="70" width="70" height="22" rx="3" fill="#475569" />
  <text x="948" y="85" fill="#ffffff" font-size="10" font-weight="bold">Properties</text>
  <rect x="1015" y="70" width="70" height="22" rx="3" fill="#475569" />
  <text x="1025" y="85" fill="#ffffff" font-size="10" font-weight="bold">Stretch</text>
  <rect x="1090" y="70" width="85" height="22" rx="3" fill="#475569" />
  <text x="1098" y="85" fill="#ffffff" font-size="10" font-weight="bold">Match Params</text>

  <!-- Main Viewport (2+1 View Split) -->
  <!-- Left View 1: 2D Floor Plan -->
  <rect x="15" y="120" width="575" height="500" rx="6" fill="#1a1c23" stroke="#2a2c34" stroke-width="1" />
  <text x="30" y="145" fill="#38bdf8" font-size="12" font-weight="bold">Görünüm 1: 2B Kat Planı (Ölçek 1:50)</text>
  <!-- Grid Lines -->
  <line x1="100" y1="170" x2="100" y2="580" stroke="#334155" stroke-dasharray="4,4" />
  <line x1="300" y1="170" x2="300" y2="580" stroke="#334155" stroke-dasharray="4,4" />
  <line x1="500" y1="170" x2="500" y2="580" stroke="#334155" stroke-dasharray="4,4" />
  <!-- Grid Labels -->
  <circle cx="100" cy="160" r="10" fill="#334155" /><text x="97" y="164" fill="#ffffff" font-size="11">A</text>
  <circle cx="300" cy="160" r="10" fill="#334155" /><text x="297" y="164" fill="#ffffff" font-size="11">B</text>
  <circle cx="500" cy="160" r="10" fill="#334155" /><text x="497" y="164" fill="#ffffff" font-size="11">C</text>

  <!-- Walls (Priority 500 Reinforced Concrete vs Priority 200 Insulation) -->
  <!-- Concrete Core (Priority 500) -->
  <rect x="100" y="250" width="400" height="30" fill="#3b82f6" opacity="0.8" stroke="#60a5fa" stroke-width="2" />
  <text x="240" y="270" fill="#ffffff" font-size="11" font-weight="bold">C30/37 Betonarme (Priority: 500)</text>
  <!-- Insulation Layer (Priority 200) -->
  <rect x="100" y="280" width="400" height="15" fill="#f59e0b" opacity="0.6" stroke="#fbbf24" stroke-width="1" />
  <text x="240" y="292" fill="#ffffff" font-size="9">XPS Yalıtım 10cm (Priority: 200)</text>

  <!-- Right Top View 2: 3D Isometric / Animation View (F4) -->
  <rect x="605" y="120" width="580" height="245" rx="6" fill="#1a1c23" stroke="#2a2c34" stroke-width="1" />
  <text x="620" y="145" fill="#38bdf8" font-size="12" font-weight="bold">Görünüm 2: 3B Perspektif Animasyon (F4)</text>
  <!-- 3D Isometric Building Block -->
  <polygon points="750,280 900,210 1050,280 900,340" fill="#2563eb" opacity="0.7" stroke="#60a5fa" stroke-width="2" />
  <polygon points="750,280 900,340 900,230 750,170" fill="#1d4ed8" opacity="0.9" stroke="#3b82f6" stroke-width="2" />
  <polygon points="900,340 1050,280 1050,170 900,230" fill="#1e40af" stroke="#2563eb" stroke-width="2" />
  <text x="860" y="270" fill="#ffffff" font-size="13" font-weight="extrabold">ALLPLAN 2026 3B BIM Model</text>

  <!-- Right Bottom View 3: Information Palette (IDS Validated) -->
  <rect x="605" y="375" width="580" height="245" rx="6" fill="#18191e" stroke="#10b981" stroke-width="1" />
  <text x="620" y="398" fill="#10b981" font-size="12" font-weight="bold">Bilgi Paleti (Information Palette) — IDS Validation OK ✔</text>
  <line x1="620" y1="410" x2="1170" y2="410" stroke="#2a2c34" stroke-width="1" />
  
  <!-- Property Rows -->
  <text x="620" y="430" fill="#94a3b8" font-size="11">Eleman Tipi:</text><text x="750" y="430" fill="#f8fafc" font-size="11" font-weight="bold">Wall (Duvar)</text>
  <text x="620" y="450" fill="#94a3b8" font-size="11">Priority (Öncelik):</text><text x="750" y="450" fill="#38bdf8" font-size="11" font-weight="bold">500 (Taşıyıcı Beton)</text>
  <text x="620" y="470" fill="#94a3b8" font-size="11">IFC Entity:</text><text x="750" y="470" fill="#f8fafc" font-size="11">IfcWallStandardCase (IFC 4.3)</text>
  <text x="620" y="490" fill="#94a3b8" font-size="11">IDS Status:</text><text x="750" y="490" fill="#34d399" font-size="11" font-weight="bold">PASSED (All attributes valid)</text>
  <text x="620" y="510" fill="#94a3b8" font-size="11">Lisans Modu:</text><text x="750" y="510" fill="#f59e0b" font-size="11">10Duke Cloud License (Named User)</text>

  <!-- Status Bar Footer -->
  <rect x="0" y="635" width="1200" height="40" fill="#18191e" stroke="#2a2c34" stroke-width="1" />
  <text x="20" y="660" fill="#64748b" font-size="11">Ölçek: 1:50 | Birim: m | Kat: Zemin Kat (0.00m) | ALLPLAN 2026 Dark Mode</text>
  <text x="950" y="660" fill="#10b981" font-size="11" font-weight="bold">● Bimplus Cloud Connected</text>
</svg>
