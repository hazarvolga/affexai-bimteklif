<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect x="0" y="0" width="1000" height="50" fill="#1e293b" />
  <text x="20" y="32" fill="#38bdf8" font-size="16" font-weight="bold">ALLPLAN 2026/2025: Çok Katmanlı Duvar/Döşeme (Multilayer Slabs) ve Priority (Öncelik) Diyagramı</text>

  <!-- Left Card: Priority Hierarchy -->
  <rect x="30" y="70" width="450" height="500" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="50" y="105" fill="#f8fafc" font-size="14" font-weight="bold">1. Duvar Katmanlarında Priority (Öncelik) Mantığı</text>
  <text x="50" y="125" fill="#94a3b8" font-size="11">Yüksek öncelikli malzeme (500), düşük öncelikli malzemeyi (200-300) keser.</text>

  <!-- Layer 1: Structural Concrete (Priority 500) -->
  <rect x="50" y="150" width="410" height="90" rx="6" fill="#1d4ed8" stroke="#3b82f6" stroke-width="2" />
  <text x="70" y="180" fill="#ffffff" font-size="14" font-weight="extrabold">Katman 1: Betonarme Taşıyıcı Duvar (Core)</text>
  <text x="70" y="200" fill="#93c5fd" font-size="12">Priority: 500 | Malzeme: C30/37 | Kalınlık: 25 cm</text>
  <text x="70" y="225" fill="#34d399" font-size="11" font-weight="bold">✔ Kalıp ve donatıda kesintisiz ana hacim (Hiçbir katman kesemez)</text>

  <!-- Layer 2: Brickwork (Priority 300) -->
  <rect x="50" y="260" width="410" height="80" rx="6" fill="#b45309" stroke="#f59e0b" stroke-width="2" />
  <text x="70" y="290" fill="#ffffff" font-size="14" font-weight="bold">Katman 2: Tuğla Bölme / Duvar (Brick)</text>
  <text x="70" y="310" fill="#fde68a" font-size="12">Priority: 300 | Malzeme: Düşey Delikli Tuğla | Kalınlık: 13 cm</text>

  <!-- Layer 3: XPS Insulation (Priority 200) -->
  <rect x="50" y="360" width="410" height="80" rx="6" fill="#047857" stroke="#10b981" stroke-width="2" />
  <text x="70" y="390" fill="#ffffff" font-size="14" font-weight="bold">Katman 3: Mantolama Yalıtım (XPS)</text>
  <text x="70" y="410" fill="#a7f3d0" font-size="12">Priority: 200 | Malzeme: Karbonlu EPS/XPS | Kalınlık: 8 cm</text>

  <!-- Warning Box -->
  <rect x="50" y="460" width="410" height="90" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
  <text x="70" y="485" fill="#fca5a5" font-size="12" font-weight="bold">⚠ SmartCheck Kural Uyarısı (allplan.wall.priority):</text>
  <text x="70" y="505" fill="#f8fafc" font-size="11">Betonarme duvar priority değeri 500'den düşük ayarlanırsa,</text>
  <text x="70" y="525" fill="#f8fafc" font-size="11">tuğla veya yalıtım katmanları betonu keser ve metraj hatalı çıkar!</text>

  <!-- Right Card: Multilayer Slabs Interactive Preview -->
  <rect x="510" y="70" width="460" height="500" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="530" y="105" fill="#f8fafc" font-size="14" font-weight="bold">2. ALLPLAN 2026/2025 Çok Katmanlı Döşeme (Multilayer Slabs)</text>
  <text x="530" y="125" fill="#94a3b8" font-size="11">Döşeme katmanlarının yönü ve uzantısı anlık görsel önizlenir.</text>

  <!-- Slab Stack Visual -->
  <!-- Layer 1: Ceramic Finish -->
  <rect x="530" y="160" width="420" height="30" fill="#64748b" stroke="#cbd5e1" stroke-width="1" />
  <text x="545" y="180" fill="#ffffff" font-size="11" font-weight="bold">Seramik Kaplama &amp; Şap (3 cm)</text>

  <!-- Layer 2: Sound Insulation -->
  <rect x="530" y="195" width="420" height="20" fill="#854d0e" stroke="#facc15" stroke-width="1" />
  <text x="545" y="210" fill="#ffffff" font-size="10">Ses Yalıtım Şiltesi (2 cm)</text>

  <!-- Layer 3: Structural Slab Core -->
  <rect x="530" y="220" width="420" height="120" fill="#1e40af" stroke="#60a5fa" stroke-width="2" />
  <text x="545" y="260" fill="#ffffff" font-size="14" font-weight="extrabold">Taşıyıcı Betonarme Döşeme (20 cm)</text>
  <text x="545" y="280" fill="#93c5fd" font-size="11">C30/37 Çift Sıra Donatılı Plak Döşeme</text>
  <text x="545" y="300" fill="#34d399" font-size="10" font-weight="bold">✔ IFC 4.3 Export Desteği (IfcSlabStandardCase)</text>

  <!-- Layer 4: Plaster Finish -->
  <rect x="530" y="345" width="420" height="20" fill="#475569" stroke="#94a3b8" stroke-width="1" />
  <text x="545" y="360" fill="#ffffff" font-size="10">Tavan Sıvası &amp; Boya (2 cm)</text>

  <!-- Multilayer Control Palette UI -->
  <rect x="530" y="385" width="420" height="165" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
  <text x="545" y="410" fill="#60a5fa" font-size="12" font-weight="bold">Multilayer Slab Extension Controls</text>
  <text x="545" y="435" fill="#94a3b8" font-size="11">Uzantı Yönü (Extension Direction):</text>
  <text x="760" y="435" fill="#34d399" font-size="11" font-weight="bold">Interactive Preview Active</text>
  <text x="545" y="460" fill="#94a3b8" font-size="11">Temel / Arazi Bağlantısı:</text>
  <text x="760" y="460" fill="#f8fafc" font-size="11">Referans Düzlemi Kilitli</text>
  <text x="545" y="485" fill="#94a3b8" font-size="11">Kübaj &amp; Metraj Hesabı:</text>
  <text x="760" y="485" fill="#f8fafc" font-size="11" font-weight="bold">Otomatik Hacim/Alan (m³/m²)</text>
</svg>
