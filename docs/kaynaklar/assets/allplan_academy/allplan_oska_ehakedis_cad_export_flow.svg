<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title Header -->
  <rect x="0" y="0" width="1100" height="55" fill="#161b22" />
  <text x="25" y="35" fill="#58a6ff" font-size="16" font-weight="extrabold">ALLPLAN ➔ OSKA e-Hakediş CAD Metraj Entegrasyon Mimarisi ve Kurulum Adımları</text>

  <!-- Flow Diagrams Step 1 to 5 -->
  <!-- Step 1: DLL Copying -->
  <rect x="30" y="80" width="320" height="230" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <rect x="30" y="80" width="320" height="35" rx="8" fill="#1f6feb" />
  <text x="45" y="103" fill="#ffffff" font-size="12" font-weight="bold">ADIM 1: DLL Dosyalarını Kopyalama</text>
  <text x="45" y="135" fill="#c9d1d9" font-size="11" font-weight="bold">Kaynak Dizin:</text>
  <text x="45" y="152" fill="#8b949e" font-size="9">...\Allplan_2013\Prg\@_Oska\64_Bit\</text>
  <rect x="45" y="165" width="290" height="45" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <text x="55" y="183" fill="#7ee787" font-size="10" font-weight="bold">📄 iXMLDialog.dll</text>
  <text x="55" y="200" fill="#7ee787" font-size="10" font-weight="bold">📄 OskaKatalog.dll</text>
  <text x="45" y="232" fill="#c9d1d9" font-size="11" font-weight="bold">Hedef Dizin:</text>
  <text x="45" y="250" fill="#f2cc60" font-size="10" font-weight="bold">...\Allplan_2013\Prg\ (Ana Klasör)</text>

  <!-- Connector Arrow 1-2 -->
  <path d="M 350 195 L 390 195" stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- Step 2: Allmenu Servisler Setup -->
  <rect x="390" y="80" width="320" height="230" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <rect x="390" y="80" width="320" height="35" rx="8" fill="#238636" />
  <text x="405" y="103" fill="#ffffff" font-size="12" font-weight="bold">ADIM 2: Servisler (Allmenu) Ayarı</text>
  <text x="405" y="135" fill="#c9d1d9" font-size="11">1. Servisler (Allmenu) uygulamasını açın.</text>
  <text x="405" y="155" fill="#c9d1d9" font-size="11">2. DXF/DWG menüsüne girin.</text>
  <rect x="405" y="170" width="290" height="55" rx="4" fill="#0d1117" stroke="#238636" stroke-width="1" />
  <text x="415" y="190" fill="#7ee787" font-size="10" font-weight="bold">Genel katalog sistemini ilişkilendir - OSKA</text>
  <text x="415" y="210" fill="#8b949e" font-size="9">Hedef DLL: iXMLDialog.dll seçin</text>
  <text x="405" y="250" fill="#7ee787" font-size="11" font-weight="bold">✔ Katalog bağlantısı aktifleştirildi</text>

  <!-- Connector Arrow 2-3 -->
  <path d="M 710 195 L 750 195" stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- Step 3: Allplan Options & Catalog Assignment -->
  <rect x="750" y="80" width="320" height="230" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <rect x="750" y="80" width="320" height="35" rx="8" fill="#8957e5" />
  <text x="765" y="103" fill="#ffffff" font-size="12" font-weight="bold">ADIM 3: Katalog Seçeneği user_kat</text>
  <text x="765" y="135" fill="#c9d1d9" font-size="11">1. Allplan > Araçlar > Seçenekler açın.</text>
  <text x="765" y="155" fill="#c9d1d9" font-size="11">2. Kataloglar (Catalogs) sekmesine girin.</text>
  <rect x="765" y="170" width="290" height="55" rx="4" fill="#0d1117" stroke="#8957e5" stroke-width="1" />
  <text x="775" y="190" fill="#d2a8ff" font-size="10" font-weight="bold">Katalog Ataması (Catalog Assignment):</text>
  <text x="775" y="210" fill="#ffffff" font-size="11" font-weight="extrabold">user_kat (Aktif Poz Kataloğu)</text>
  <text x="765" y="250" fill="#d2a8ff" font-size="11" font-weight="bold">✔ Malzeme seçerken OSKA pozları açılır</text>

  <!-- Step 4 & 5: Exporting to OSKA -->
  <rect x="30" y="340" width="1040" height="270" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2" />
  <rect x="30" y="340" width="1040" height="40" rx="8" fill="#d97706" />
  <text x="50" y="366" fill="#ffffff" font-size="14" font-weight="extrabold">ADIM 4 &amp; 5: Model Metrajını OSKA e-Hakediş CAD'e Gönderme (CAD Export)</text>

  <!-- Left Column inside Export Box -->
  <text x="60" y="410" fill="#c9d1d9" font-size="12" font-weight="bold">1. Menü Yolu:</text>
  <text x="60" y="430" fill="#58a6ff" font-size="13" font-weight="bold">Dosya ➔ Dosya Gönder ➔ OSKA'ya Metraj Verilerini Gönder...</text>
  
  <text x="60" y="465" fill="#c9d1d9" font-size="12" font-weight="bold">2. Ayarlar Penceresi Hedef Bilgileri:</text>
  <rect x="60" y="475" width="460" height="50" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <text x="75" y="495" fill="#8b949e" font-size="10">Metraj Rapor Tablosu:</text>
  <text x="210" y="495" fill="#7ee787" font-size="11" font-weight="bold">Metraj Cetveli.rdlc</text>
  <text x="75" y="515" fill="#8b949e" font-size="10">Kullanılacak Program:</text>
  <text x="210" y="515" fill="#f2cc60" font-size="11" font-weight="bold">C:\e-Oska\OskaCad.exe</text>

  <!-- Right Column inside Export Box -->
  <rect x="550" y="400" width="500" height="185" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1" />
  <text x="570" y="425" fill="#7ee787" font-size="13" font-weight="bold">Otomatik e-Hakediş Çıktı Sonuçları:</text>
  <text x="570" y="450" fill="#c9d1d9" font-size="11">✔ Beton, donatı, kalıp ve duvar metrajları anında çekilir.</text>
  <text x="570" y="472" fill="#c9d1d9" font-size="11">✔ Oska Hakediş yazılımında Hakediş Yeşil Defteri otomatik oluşur.</text>
  <text x="570" y="494" fill="#c9d1d9" font-size="11">✔ TeklifPro SmartCheck kural kontrolü ile metraj uyuşmazlığı taranır.</text>
  <text x="570" y="525" fill="#58a6ff" font-size="12" font-weight="bold">Sonuç: Hakediş hazırlama süresi %80 kısalır, insan hatası sıfırlanır.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
    </marker>
  </defs>
</svg>
