# Coolify Git/Docker Compose deployment. Configure the domain on the app service.
# Inject secrets in Coolify; no host env_file paths or published database ports.
# Runtime-only secrets are absent during Coolify build interpolation. Empty defaults
# permit image builds; production JWT/storage validation and PostgreSQL auth reject missing
# runtime values. Keep both generated secrets enabled for runtime injection.
name: bimmetraj

# Coolify replaces literal empty values from its environment database. Preserve
# an empty reference until Compose interpolation; keep BIMMETRAJ_EMPTY_ENV unset
# or empty. This overrides the shared env_file without exposing backup secrets.
x-no-backup-environment: &no-backup-environment
  BACKUP_S3_BUCKET: ${BIMMETRAJ_EMPTY_ENV:-}
  BACKUP_S3_ENDPOINT: ${BIMMETRAJ_EMPTY_ENV:-}
  BACKUP_S3_ACCESS_KEY_ID: ${BIMMETRAJ_EMPTY_ENV:-}
  BACKUP_S3_SECRET_ACCESS_KEY: ${BIMMETRAJ_EMPTY_ENV:-}
  AUTH_EMAIL_SMTP_HOST: ${BIMMETRAJ_EMPTY_ENV:-}
  AUTH_EMAIL_SMTP_PORT: ${BIMMETRAJ_EMPTY_ENV:-}
  AUTH_EMAIL_SMTP_USER: ${BIMMETRAJ_EMPTY_ENV:-}
  AUTH_EMAIL_SMTP_PASSWORD: ${BIMMETRAJ_EMPTY_ENV:-}
  AUTH_EMAIL_FROM: ${BIMMETRAJ_EMPTY_ENV:-}
  AUTH_EMAIL_WEBHOOK_URL: ${BIMMETRAJ_EMPTY_ENV:-}
  AUTH_EMAIL_WEBHOOK_SECRET: ${BIMMETRAJ_EMPTY_ENV:-}
  # Coolify exposes its application environment to every service. Connection
  # URLs below are interpolated by Compose; never retain raw role/bootstrap
  # credentials in a runtime container environment.
  BIMMETRAJ_APP_DB_PASSWORD: ${BIMMETRAJ_EMPTY_ENV:-}
  BIMMETRAJ_CONTROL_DB_PASSWORD: ${BIMMETRAJ_EMPTY_ENV:-}
  BIMMETRAJ_WORKER_DB_PASSWORD: ${BIMMETRAJ_EMPTY_ENV:-}
  BIMMETRAJ_MIGRATOR_DB_PASSWORD: ${BIMMETRAJ_EMPTY_ENV:-}
  BIMMETRAJ_BACKUP_DB_PASSWORD: ${BIMMETRAJ_EMPTY_ENV:-}
  SERVICE_PASSWORD_64_POSTGRES: ${BIMMETRAJ_EMPTY_ENV:-}
  RELEASE_WORKERS_DRAINED: ${BIMMETRAJ_EMPTY_ENV:-}
  MFA_ENCRYPTION_KEY: ${BIMMETRAJ_EMPTY_ENV:-}

x-app-environment: &app-environment
  <<: *no-backup-environment
  NODE_ENV: production
  PG_POOL_MAX: '4'
  JWT_SECRET: ${SERVICE_HEX_64_JWT:-}
  PUBLIC_APP_URL: https://bimmetraj.com
  AUTH_EMAIL_DELIVERY_MODE: ${BIMMETRAJ_EMPTY_ENV:-disabled}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  GRAPHILE_WORKER_SCHEMA: teklifpro_queue
  SMARTCHECK_IMPORT_ENABLED: ${SMARTCHECK_IMPORT_ENABLED:-false}
  SMARTCHECK_PILOT_COMPANY_IDS: ${SMARTCHECK_PILOT_COMPANY_IDS:-}
  SMARTCHECK_S3_BUCKET: ${SMARTCHECK_S3_BUCKET:-}
  SMARTCHECK_S3_REGION: ${SMARTCHECK_S3_REGION:-}
  SMARTCHECK_S3_ENDPOINT: ${SMARTCHECK_S3_ENDPOINT:-}
  SMARTCHECK_S3_ACCESS_KEY_ID: ${SMARTCHECK_S3_ACCESS_KEY_ID:-}
  SMARTCHECK_S3_SECRET_ACCESS_KEY: ${SMARTCHECK_S3_SECRET_ACCESS_KEY:-}
  SMARTCHECK_S3_FORCE_PATH_STYLE: ${SMARTCHECK_S3_FORCE_PATH_STYLE:-false}
  SMARTCHECK_S3_REQUIRE_STATIC_CREDENTIALS: 'true'
  SMARTCHECK_IFC_ENGINE: ifcopenshell
  SMARTCHECK_MAX_IFC_FILE_MB: ${SMARTCHECK_MAX_IFC_FILE_MB:-100}
  SMARTCHECK_IFC_MAX_CONCURRENT: ${SMARTCHECK_IFC_MAX_CONCURRENT:-2}
  SMARTCHECK_TENANT_STORAGE_MAX_BYTES: ${SMARTCHECK_TENANT_STORAGE_MAX_BYTES:-2147483648}
  SMARTCHECK_TENANT_DOCUMENT_MAX_COUNT: ${SMARTCHECK_TENANT_DOCUMENT_MAX_COUNT:-1000}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-runtime: &runtime
  restart: unless-stopped
  stop_grace_period: 90s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp:size=268435456,mode=1777
    - /home/node/.cache:size=67108864,uid=1000,gid=1000
    - /home/node/.config:size=16777216,uid=1000,gid=1000
  depends_on:
    postgres:
      condition: service_healthy
    db-provision:
      condition: service_completed_successfully

services:
  app:
    <<: *runtime
    security_opt:
      - no-new-privileges:true
      - seccomp=${CHROMIUM_SECCOMP_PROFILE:-./deploy/chromium-seccomp.json}
    image: bimmetraj-app:${IMAGE_TAG:-local}
    build:
      context: .
      target: app
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    environment:
      <<: *app-environment
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql://bimmetraj_app:${BIMMETRAJ_APP_DB_PASSWORD:-}@postgres:5432/bimmetraj_production
      CONTROL_DATABASE_URL: postgresql://bimmetraj_control:${BIMMETRAJ_CONTROL_DB_PASSWORD:-}@postgres:5432/bimmetraj_production
      AUTH_EMAIL_DELIVERY_MODE: ${AUTH_EMAIL_DELIVERY_MODE:-disabled}
      AUTH_EMAIL_SMTP_HOST: ${AUTH_EMAIL_SMTP_HOST:-}
      AUTH_EMAIL_SMTP_PORT: ${AUTH_EMAIL_SMTP_PORT:-465}
      AUTH_EMAIL_SMTP_USER: ${AUTH_EMAIL_SMTP_USER:-}
      AUTH_EMAIL_SMTP_PASSWORD: ${AUTH_EMAIL_SMTP_PASSWORD:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_EMAIL_WEBHOOK_URL: ${AUTH_EMAIL_WEBHOOK_URL:-}
      AUTH_EMAIL_WEBHOOK_SECRET: ${AUTH_EMAIL_WEBHOOK_SECRET:-}
      PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=768
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      EXPERT_FEEDBACK_EMAIL: ${EXPERT_FEEDBACK_EMAIL:-}
    expose: ['3000']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    shm_size: 256mb
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256

  worker:
    <<: *runtime
    image: bimmetraj-worker:${IMAGE_TAG:-local}
    build:
      context: .
      target: worker
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql://bimmetraj_worker:${BIMMETRAJ_WORKER_DB_PASSWORD:-}@postgres:5432/bimmetraj_production
      JWT_SECRET: ${BIMMETRAJ_EMPTY_ENV:-}
      SERVICE_HEX_64_JWT: ${BIMMETRAJ_EMPTY_ENV:-}
      NODE_OPTIONS: --max-old-space-size=768
      SMARTCHECK_WORKER_CONCURRENCY: ${SMARTCHECK_WORKER_CONCURRENCY:-2}
      SENTRY_DSN: ${SENTRY_DSN:-}
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 128

  ifc-worker:
    <<: *runtime
    image: bimmetraj-ifc-worker:${IMAGE_TAG:-local}
    build:
      context: .
      target: ifc-worker
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql://bimmetraj_worker:${BIMMETRAJ_WORKER_DB_PASSWORD:-}@postgres:5432/bimmetraj_production
      JWT_SECRET: ${BIMMETRAJ_EMPTY_ENV:-}
      SERVICE_HEX_64_JWT: ${BIMMETRAJ_EMPTY_ENV:-}
      NODE_OPTIONS: --max-old-space-size=1024
      SMARTCHECK_IFC_WORKER_CONCURRENCY: ${SMARTCHECK_IFC_WORKER_CONCURRENCY:-1}
      SMARTCHECK_IFC_TIMEOUT_SEC: ${SMARTCHECK_IFC_TIMEOUT_SEC:-600}
      PYTHON_BIN: /opt/venv/bin/python3
      SENTRY_DSN: ${SENTRY_DSN:-}
    tmpfs:
      - /tmp:size=536870912,mode=1777
      - /home/node/.cache:size=67108864,uid=1000,gid=1000
    mem_limit: 2048m
    cpus: 1.5
    pids_limit: 128

  migrate:
    image: bimmetraj-migrate:${IMAGE_TAG:-local}
    build:
      context: .
      target: migrate
    environment:
      <<: *no-backup-environment
      NODE_ENV: production
      PG_POOL_MAX: '4'
      RELEASE_DATABASE_URL: postgresql://bimmetraj_migrator:${BIMMETRAJ_MIGRATOR_DB_PASSWORD:-}@postgres:5432/bimmetraj_production
      RELEASE_ALLOW_PRODUCTION: 'true'
      RELEASE_EXPECTED_HOST: postgres
      RELEASE_EXPECTED_DATABASE: bimmetraj_production
      RELEASE_EXPECTED_USER: bimmetraj_migrator
      RELEASE_WORKERS_DRAINED: ${RELEASE_WORKERS_DRAINED:?RELEASE_WORKERS_DRAINED=true is required after workers are stopped}
    restart: 'no'
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy


  # Manual production role provisioning only: compose --profile operator run --rm role-admin <inspect|bootstrap-legacy|provision>.
  # This service is not part of the normal startup graph and carries DB admin credentials only for one-shot operator actions.
  role-admin:
    profiles: [operator]
    image: bimmetraj-migrate:${IMAGE_TAG:-local}
    build:
      context: .
      target: migrate
    command: [node, dist/database-roles-cli.mjs, inspect]
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    environment: &db-admin-environment
      <<: *no-backup-environment
      NODE_ENV: production
      DATABASE_ROLE_ADMIN_URL: postgresql://bimmetraj:${SERVICE_PASSWORD_64_POSTGRES:-}@postgres:5432/bimmetraj_production
      DATABASE_ROLE_INSPECT_URL: postgresql://bimmetraj:${SERVICE_PASSWORD_64_POSTGRES:-}@postgres:5432/bimmetraj_production
      DATABASE_ROLE_ALLOW_PROVISION: 'true'
      DATABASE_ROLE_EXPECTED_DATABASE: bimmetraj_production
      DATABASE_ROLE_EXPECTED_SYSTEM_IDENTIFIER: ${DATABASE_ROLE_EXPECTED_SYSTEM_IDENTIFIER:-}
      DATABASE_ROLE_REQUIRED_MARKER: teklifpro_release.migrations
      BIMMETRAJ_APP_DB_PASSWORD: ${BIMMETRAJ_APP_DB_PASSWORD:-}
      BIMMETRAJ_CONTROL_DB_PASSWORD: ${BIMMETRAJ_CONTROL_DB_PASSWORD:-}
      BIMMETRAJ_WORKER_DB_PASSWORD: ${BIMMETRAJ_WORKER_DB_PASSWORD:-}
      BIMMETRAJ_MIGRATOR_DB_PASSWORD: ${BIMMETRAJ_MIGRATOR_DB_PASSWORD:-}
      BIMMETRAJ_BACKUP_DB_PASSWORD: ${BIMMETRAJ_BACKUP_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy


  # One-shot deploy steps that need the bootstrap administrator: an empty database gets its
  # canonical roles before migrations (db-bootstrap) and every deploy converges grants, RLS and
  # the queue schema after them (db-provision). Both exit; no long-running service receives the
  # administrator or role credentials.
  db-bootstrap:
    image: bimmetraj-migrate:${IMAGE_TAG:-local}
    build:
      context: .
      target: migrate
    command: [node, dist/database-roles-cli.mjs, bootstrap-fresh]
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    environment: *db-admin-environment
    depends_on:
      postgres:
        condition: service_healthy

  db-provision:
    image: bimmetraj-migrate:${IMAGE_TAG:-local}
    build:
      context: .
      target: migrate
    command: [node, dist/database-roles-cli.mjs, deploy-provision]
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    environment: *db-admin-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Coolify Scheduled Task: container=backup, command=/usr/local/bin/bimmetraj-backup.
  # Idle until scheduled; empty backup credentials fail closed only when invoked.
  backup:
    image: bimmetraj-backup:${IMAGE_TAG:-local}
    build:
      context: ./deploy/backup
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    environment:
      <<: *no-backup-environment
      SMARTCHECK_S3_ACCESS_KEY_ID: ${BIMMETRAJ_EMPTY_ENV:-}
      SMARTCHECK_S3_SECRET_ACCESS_KEY: ${BIMMETRAJ_EMPTY_ENV:-}
      JWT_SECRET: ${BIMMETRAJ_EMPTY_ENV:-}
      SERVICE_HEX_64_JWT: ${BIMMETRAJ_EMPTY_ENV:-}
      OPENAI_API_KEY: ${BIMMETRAJ_EMPTY_ENV:-}
      GEMINI_API_KEY: ${BIMMETRAJ_EMPTY_ENV:-}
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: bimmetraj_production
      PGUSER: bimmetraj_backup
      PGPASSWORD: ${BIMMETRAJ_BACKUP_DB_PASSWORD:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      <<: *no-backup-environment
      POSTGRES_DB: bimmetraj_production
      POSTGRES_USER: bimmetraj
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:-}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, work_mem=4MB]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    shm_size: 128mb

volumes:
  backup-data:
  postgres-data:
